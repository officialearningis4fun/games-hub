plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {

    namespace 'com.learningis4fun.gameshub'

    defaultConfig {
        applicationId "com.learningis4fun.gameshub"
        minSdkVersion 21
        compileSdk 34
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 12
        versionName "1.0.0-beta10"

        buildConfigField("String", "GEMINI_API_KEY", "${GEMINI_API_KEY}")
        testInstrumentationRunner "com.learningis4fun.gameshub.HiltTestRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }

        defaultConfig {
            ksp {
                arg("room.schemaLocation", "$projectDir/schemas")
                arg("room.incremental", "true")
                arg("room.expandProjection", "true")
            }
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }

    kotlinOptions {
        jvmTarget = '18'
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(18))
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/licenses/ASM', 'win32-x86/attach_hotspot_windows.dll', 'win32-x86-64/attach_hotspot_windows.dll', 'META-INF/INDEX.LIST']
        }
    }


    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

}

composeCompiler {
    enableStrongSkippingMode = true
}

dependencies {

    // gemini api
    implementation libs.generativeai

    // ui
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    implementation libs.ui.text.google.fonts
    // util
    implementation libs.preference.ktx
    implementation libs.gson

    implementation libs.multidex

    // kotlin
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx

    //firebase
    implementation libs.firebase.auth.ktx
    implementation libs.play.services.auth
    implementation libs.firebase.analytics.ktx

    implementation libs.play.services.ads

    implementation libs.kotlinx.coroutines.play.services

    //viewModel
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    // liveData
    implementation libs.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.common.java8

    // room
    implementation libs.room.ktx
    implementation libs.room.runtime
    ksp libs.androidx.room.compiler

    //hilt
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler
    ksp libs.hilt.compiler
    implementation libs.activity.ktx

    // retrofit
    implementation libs.retrofit
    implementation libs.converter.gson

    //glide
    implementation libs.coil
    implementation(libs.coil.compose)

    //navigation
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx
    implementation libs.navigation.compose

    implementation libs.hilt.navigation.compose

    //coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // dataStore
    implementation libs.androidx.datastore
    implementation libs.androidx.datastore.preferences

    // ktor client
    // Ktor
    implementation libs.ktor.client.core
    implementation libs.ktor.client.cio
    implementation libs.ktor.client.serialization
    implementation libs.ktor.client.websockets
    implementation libs.ktor.client.logging
    //noinspection GradleDependency Clashes with google gemini sdk on higher versions
    implementation libs.logback.classic

    implementation libs.kotlinx.serialization.json

    // Compose
    implementation libs.runtime
    implementation libs.androidx.ui
    implementation libs.androidx.ui.viewbinding
    implementation libs.androidx.foundation
    implementation libs.androidx.foundation.layout
    implementation libs.androidx.material3
    implementation libs.androidx.animation
    //"androidx.compose.material3:material3-window-size-class:1.3.1"
    implementation libs.androidx.material3.window.size
    implementation libs.androidx.ui.tooling
    implementation libs.androidx.constraintlayout.compose

    implementation libs.androidx.activity.compose
    implementation libs.androidx.ui.text
    implementation libs.androidx.ui.tooling.preview

    // unit test
    testImplementation libs.junit
    testImplementation libs.google.truth
    testImplementation libs.hamcrest.all
    testImplementation libs.core.testing
    testImplementation libs.robolectric
    testImplementation libs.jetbrains.kotlinx.coroutines.test
    testImplementation libs.mockito.mockito.core

    // instrumentation
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation(libs.androidx.espresso.contrib) {
        exclude group: 'org.checkerframework', module: 'checker'
    }


    androidTestImplementation libs.mockito.mockito.core
    androidTestImplementation libs.jetbrains.kotlinx.coroutines.test
    androidTestImplementation libs.core.testing
    androidTestImplementation libs.google.truth
    // room
    androidTestImplementation libs.androidx.room.testing
    androidTestImplementation libs.androidx.navigation.testing

    // For Robolectric tests.
    testImplementation libs.google.hilt.android.testing
    // ...with Kotlin.
    kspTest libs.hilt.android.compiler

    // For instrumented tests.
    androidTestImplementation libs.google.hilt.android.testing
    // ...with Kotlin.
    kspAndroidTest libs.hilt.android.compiler
    debugImplementation libs.androidx.fragment.testing
    testImplementation libs.koin.test
    testImplementation libs.koin.test.junit4

}